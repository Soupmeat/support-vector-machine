name: CI / Build, Test & Publish

on:
  push: 
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published] # Triggers wheel building and publishing when a release is published

jobs:
  # --- JOB 1: Test the C++ layer (Runs on EVERY push, PR, and release) ---
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Install CMake & CTest
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_PYTHON=OFF

      - name: Build Project
        run: cmake --build build

      - name: Run Tests
        working-directory: ./build
        run: ctest

  # --- JOB 2: Build wheels via cibuildwheel (Runs ONLY if tests pass) ---
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: test-cpp  # Gate: Must wait for C++ tests to pass successfully
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels using cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # --- JOB 3: Publish to PyPI (Runs ONLY on release, after wheels are built) ---
  pypi-publish:
    name: Publish release to PyPI
    needs: [test-cpp, build-wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/svm_cpp # Replace with your exact PyPI package name
    permissions:
      id-token: write # Required for PyPI Trusted Publishing OIDC

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1