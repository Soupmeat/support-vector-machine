name: Build, Test & Publish

on:
  push: 
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - run: cmake -B build -S . -DBUILD_PYTHON=OFF
      - run: cmake --build build
      - working-directory: ./build
        run: ctest

  build-wheels:
    name: Build wheels for ${{ matrix.name }}
    needs: test-cpp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: manylinux_x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: manylinux_aarch64
          - name: macOS Apple Silicon
            os: macos-14
            platform: macosx_arm64
          - name: Windows x86_64
            os: windows-latest
            platform: win_amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels using cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Automatically targets ALL Python versions (3.10 -> 3.14t) for this platform
          CIBW_BUILD: "cp*-${{ matrix.platform }}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  pypi-publish:
    name: Publish release to PyPI
    needs: [test-cpp, build-wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/svm_cpp
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1