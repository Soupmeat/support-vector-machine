name: Build, Test & Publish

on:
  push: 
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  # --- JOB 1: Test the pure C++ layer ---
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake & CTest
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_PYTHON=OFF

      - name: Build Project
        run: cmake --build build

      - name: Run Tests
        working-directory: ./build
        run: ctest

  # --- JOB 2: Build wheels via cibuildwheel across platforms ---
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: test-cpp
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 = Intel Mac, macos-latest = Apple Silicon Mac
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for Linux ARM64 builds)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels using cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # --- JOB 3: Publish to PyPI on release ---
  pypi-publish:
    name: Publish release to PyPI
    needs: [test-cpp, build-wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/svm_cpp
    permissions:
      id-token: write

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1