[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "cython>=3.0.0",
    "cmake>=3.25",
    "numpy>=2.0.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "svm_cpp"
version = "0.1.0"
description = "A high-performance C++ SVM library with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sukhmit Singh", email = "sukhmitsingh442@gmail.com" }
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy>=2.0.0"]
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "scikit-learn>=1.0",
]
[tool.scikit-build]
cmake.version = ">=3.25"
[tool.cibuildwheel]
# Automatically builds x86_64 and arm64 across Linux, macOS, and Windows
archs = "auto64"

# Use a modern Linux container image (GCC 11+) to support C++20 and ARM64 emulation smoothly
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Command to run inside the isolated test environment after building the wheel
test-command = "pytest {project}/tests"

# Requirements to install before running the tests in cibuildwheel's test container
test-requires = [
    "pytest",
    "scikit-learn",
    "numpy"
]

[tool.cibuildwheel.macos]
before-all = "brew install libomp"

[tool.cibuildwheel.macos.environment]
OpenMP_ROOT = "$(brew --prefix libomp)"